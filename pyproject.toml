[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "speedtest-z"
dynamic = ["version"]
description = "Automates major speed test sites with a web browser for continuous network quality monitoring"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "AIKAWA Shigechika"},
]
keywords = ["speedtest", "selenium", "zabbix", "monitoring", "network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking",
]
dependencies = [
    "selenium>=4.10,<5",
    "zappix>=1.2,<2",
]

[project.optional-dependencies]
dev = ["ruff", "mypy"]
test = ["pytest", "pytest-cov"]
completion = ["argcomplete"]
grafana = ["cramjam"]
otel = ["opentelemetry-api", "opentelemetry-sdk", "opentelemetry-exporter-otlp-proto-http"]

[project.urls]
Homepage = "https://github.com/shigechika/speedtest-z"
Repository = "https://github.com/shigechika/speedtest-z"
Issues = "https://github.com/shigechika/speedtest-z/issues"
Changelog = "https://github.com/shigechika/speedtest-z/blob/main/CHANGELOG.md"

[project.scripts]
speedtest-z = "speedtest_z.cli:main"

[tool.setuptools]
packages = ["speedtest_z", "speedtest_z.sites"]

[tool.setuptools.package-data]
speedtest_z = ["README.md", "README.ja.md"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.setuptools_scm]
