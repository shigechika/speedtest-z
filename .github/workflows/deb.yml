name: Build .deb packages

# Called from release-please.yml while the release is still a DRAFT so the
# assets are attached before publishing (required for immutable releases —
# assets cannot be added after publish). workflow_dispatch remains for
# ad-hoc builds and uploads nothing.
on:
  workflow_call:
    inputs:
      tag:
        description: "Draft release tag to attach the .deb to (e.g. v0.8.1)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.8.1)"
        required: true

jobs:
  build-deb:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            codename: jammy
          - os: ubuntu-24.04
            codename: noble
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            dh-virtualenv \
            python3-dev \
            python3-venv \
            python3-virtualenv \
            python3-pip \
            python3-setuptools \
            dpkg-dev

      - name: Update debian/changelog version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${INPUT_TAG#v}"
          fi
          # Prepend a proper changelog stanza (version, entry, maintainer, date)
          # instead of only rewriting the version of the existing top entry.
          {
            printf '%s\n\n' "speedtest-z (${VERSION}-1) unstable; urgency=medium"
            printf '  * Release %s\n\n' "${VERSION}"
            printf ' -- %s  %s\n\n' \
              "AIKAWA Shigechika <shigechika@users.noreply.github.com>" "$(date -R)"
            cat debian/changelog
          } > debian/changelog.new
          mv debian/changelog.new debian/changelog

      - name: Build .deb package
        run: dpkg-buildpackage -us -uc -b

      - name: Rename .deb with codename suffix
        run: |
          for deb in ../speedtest-z_*.deb; do
            mv "$deb" "${deb%.deb}~${{ matrix.codename }}.deb"
          done

      # The release is still a draft at this point; gh resolves draft
      # releases by tag name for users with push access.
      - name: Upload .deb to GitHub Release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" ../speedtest-z_*~${{ matrix.codename }}.deb --clobber
