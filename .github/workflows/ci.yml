name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Lint the GitHub Actions workflows themselves (incl. shellcheck on run blocks)
  # so workflow mistakes are caught at PR time, not only when release.yml/deb.yml/
  # rpm.yml run at release. Separate job so the test (3.x) check names stay stable.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint workflows (actionlint)
        shell: bash
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install package with test and dev dependencies
        run: pip install -e ".[test,dev]"

      - name: Lint (ruff check)
        run: ruff check speedtest_z/ tests/

      - name: Format check (ruff format)
        run: ruff format --check speedtest_z/ tests/

      - name: Type check (mypy)
        run: mypy speedtest_z/

      - name: Syntax check
        run: python3 -c "import speedtest_z.cli"

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=speedtest_z --cov-report=term-missing

      - name: CLI version check
        run: speedtest-z --version

      - name: CLI list-sites check
        run: speedtest-z --list-sites

      - name: Build package
        run: pip install build && python -m build
